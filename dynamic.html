class DynamicAnalyzerApp {
  constructor() {
    this.kbui = KitBuildUI.instance(DynamicAnalyzerApp.canvasId)
    let canvas = this.kbui.canvases.get(DynamicAnalyzerApp.canvasId)
    // canvas.addToolbarTool(KitBuildToolbar.UNDO_REDO, { priority: 3 })
    canvas.addCanvasTool(KitBuildCanvasTool.FOCUS, { gridPos: { x: 0, y: -1}})
    canvas.addToolbarTool(KitBuildToolbar.CAMERA, { priority: 4 })
    canvas.addToolbarTool(KitBuildToolbar.UTILITY, { priority: 5, trash: false })
    canvas.toolbar.addTool("compare-switch", new CompareSwitchTool(canvas))
    canvas.canvasTool.enableConnector(false).enableIndicator(false)
    canvas.toolbar.render()
    // canvas.addCanvasTool(KitBuildCanvasTool.CENTROID)

    this.session = Core.instance().session()
    // Hack for sidebar-panel show/hide
    // To auto-resize the canvas.
    let observer = new MutationObserver((mutations) => $(`#${DynamicAnalyzerApp.canvasId} > div`).css('width', 0))
    observer.observe(document.querySelector('#admin-sidebar-panel'), {attributes: true})
    // Enable tooltip
    $('[data-bs-toggle="tooltip"]').tooltip({ html: true }) 
  }

  static instance() {
    DynamicAnalyzerApp.inst = new DynamicAnalyzerApp()
    DynamicAnalyzerApp.handleEvent(DynamicAnalyzerApp.inst.kbui)
    DynamicAnalyzerApp.handleRefresh(DynamicAnalyzerApp.inst.kbui)
  }

  setConceptMap(conceptMap) { console.warn("CONCEPT MAP SET:", conceptMap)
    this.conceptMap = conceptMap
    if (conceptMap) {
      this.session.set('cmid', conceptMap.map.cmid)
      let status = `<span class="mx-2 d-flex align-items-center">`
        + `<span class="badge rounded-pill bg-secondary">ID: ${conceptMap.map.cmid}</span>`
        + `<span class="text-secondary ms-2 text-truncate"><small>${conceptMap.map.title}</small></span>`
        + `</span>`
      StatusBar.instance().content(status);
    } else {
      StatusBar.instance().content('');
      this.session.unset('cmid')
    }
  }
}

DynamicAnalyzerApp.canvasId = "analyzer-canvas"

DynamicAnalyzerApp.handleEvent = kbui => {

  this.canvas = kbui.canvases.get(DynamicAnalyzerApp.canvasId);
  this.ajax = Core.instance().ajax();
  this.session = Core.instance().session();

  let openDialog = UI.modal('#concept-map-open-dialog', {
    hideElement: '.bt-cancel'
  })











  /** 
   * 
   * Open
  */

  $('.app-navbar .bt-open').on('click', (e) => { console.log(e)
    openDialog.show()
    let tid = openDialog.tid;
    if (!tid) $('#concept-map-open-dialog .list-topic .list-item.default').trigger('click');
    else $(`#concept-map-open-dialog .list-topic .list-item[data-tid="${tid}"]`).trigger('click');
  })

  $('#concept-map-open-dialog .list-topic').on('click', '.list-item', (e) => {
    if (openDialog.tid != $(e.currentTarget).attr('data-tid')) // different concept map?
      openDialog.cmid = null; // reset selected concept map id.
    openDialog.tid = $(e.currentTarget).attr('data-tid');
    $('#concept-map-open-dialog .list-topic .bi-check-lg').addClass('d-none');
    $('#concept-map-open-dialog .list-topic .list-item').removeClass('active');
    $(e.currentTarget).find('.bi-check-lg').removeClass('d-none');
    $(e.currentTarget).addClass('active');

    this.ajax.get(`kitBuildApi/getConceptMapListByTopic/${openDialog.tid}`).then(cmaps => { // console.log(cmaps)
      let cmapsHtml = '';
      cmaps.forEach(cm => {
        cmapsHtml += `<span class="concept-map list-item" data-cmid="${cm.cmid}" data-cmfid="${cm.cmfid}">`
          + `<span class="text-truncate">${cm.title}</span>`
          + `<bi class="bi bi-check-lg text-primary d-none"></bi></span>`
      })
      $('#concept-map-open-dialog .list-concept-map').slideUp({
        duration: 100,
        complete: () => {
          $('#concept-map-open-dialog .list-concept-map')
            .html(cmapsHtml).slideDown({
              duration: 100,
              complete: () => {
                if(openDialog.cmid) {
                  $(`#concept-map-open-dialog .list-concept-map .list-item[data-cmid="${openDialog.cmid}"]`)
                    .trigger('click')[0]
                    .scrollIntoView({
                      behavior: "smooth",
                      block: "center"
                    });
                } else $('#concept-map-open-dialog .list-concept-map').scrollTop(0)
              }
            })
        }
      })
    })
  })

  $('#concept-map-open-dialog .list-concept-map').on('click', '.list-item', (e) => {
    openDialog.cmid = $(e.currentTarget).attr('data-cmid');
    $('#concept-map-open-dialog .list-concept-map .bi-check-lg').addClass('d-none');
    $('#concept-map-open-dialog .list-concept-map .list-item').removeClass('active');
    $(e.currentTarget).find('.bi-check-lg').removeClass('d-none');
    $(e.currentTarget).addClass('active');
  })
  
  $('#concept-map-open-dialog .bt-refresh-topic-list').on('click', () => {
    this.ajax.get('kitBuildApi/getTopicList').then(topics => { // console.log(topics)
      let topicsHtml = '';
      topics.forEach(t => { // console.log(t);
        topicsHtml += `<span class="topic list-item" data-tid="${t.tid}">`
         + `<em>${t.title}</em>`
         + `<bi class="bi bi-check-lg text-primary d-none"></bi></span>`
      });
      $('#concept-map-open-dialog .list-topic').slideUp({
        duration: 100,
        complete: () => {
          $('#concept-map-open-dialog .list-topic .list-item').not('.default').remove()
          $('#concept-map-open-dialog .list-topic').append(topicsHtml).slideDown(100)
          $(`#concept-map-open-dialog .list-topic .list-item[data-tid="${openDialog.tid}"]`).trigger('click')
        }
      })
    })
  })

  $('#concept-map-open-dialog').on('click', '.bt-open', (e) => {
    e.preventDefault()
    if (!openDialog.cmid) {
      UI.dialog('Please select a concept map.').show();
      return
    }
    KitBuild.openConceptMap(openDialog.cmid).then(conceptMap => { console.log(conceptMap)
      let proceed = () => {
        let cyData = KitBuildUI.composeConceptMap(conceptMap)
        this.canvas.cy.elements().remove()
        this.canvas.cy.add(cyData)
        this.canvas.applyElementStyle()
        this.canvas.toolbar.tools.get(KitBuildToolbar.CAMERA).fit(null, {duration: 0});
        this.canvas.canvasTool.clearCanvas().clearIndicatorCanvas();
        DynamicAnalyzerApp.inst.setConceptMap(conceptMap)
        DynamicAnalyzerApp.populateLearnerMaps(conceptMap.map.cmid)
        DynamicAnalyzerApp.populateKits(conceptMap.map.cmid)
        UI.success('Concept map loaded.').show()
        openDialog.hide()
      }
      if (this.canvas.cy.elements().length) {
        let confirm = UI.confirm('Do you want to open and replace current concept map on canvas?').positive(() => {            
          confirm.hide()
          proceed()
        }).show()
      } else proceed()
    }).catch(error => {
      console.error(error); 
      UI.dialog("The concept map data is invalid.", {
        icon: 'exclamation-triangle',
        iconStyle: 'danger'

DynamicAnalyzerApp.populateLearnerMaps = (cmid) => {
  return new Promise((resolve, reject) => {
    Core.instance().ajax().get(`kitBuildApi/getLearnerMapsOfConceptMap/${cmid}`)
      .then(learnerMaps => { // console.log(learnerMaps)
      learnerMaps = Core.decompress(learnerMaps);
      let list = ''
      let score = '147%'
      DynamicAnalyzerApp.inst.learnerMaps = new Map(learnerMaps.map(obj => [obj.map.lmid, obj]));

      learnerMaps.map(learnerMap => {
        learnerMap.conceptMap = DynamicAnalyzerApp.inst.conceptMap
        Analyzer.composePropositions(learnerMap)
        learnerMap.compare = Analyzer.compare(learnerMap)
      })

      learnerMaps.forEach((lm, i) => {
        let isFirst = i == 0 || i > 0 && learnerMaps[i-1].map.author != lm.map.author
        let isLast = (learnerMaps[i+1] && learnerMaps[i+1].map.author != lm.map.author) || !learnerMaps[i+1]
        let score = (lm.compare.score * 1000 | 0) / 10 + '%' 
        list += `<div data-lmid="${lm.map.lmid}" data-type="${lm.map.type}" data-kid="${lm.map.kid}" data-first="${isFirst}" data-last="${isLast}"`
        list += ` class="py-1 mx-1 d-flex justify-content-between border-bottom learnermap list-item fs-6" role="button">`
        list += `<span class="d-flex align-items-center">`
        list += `<input type="checkbox" class="cb-learnermap" id="cb-lm-${lm.map.lmid}">`
        list += `<label class="text-truncate ms-1"><small>${lm.map.author}</small></label>`
        list += `</span>`
        list += `<span class="d-flex align-items-center">`
        if (lm.map.type == "feedback") list += `<span class="badge bg-warning text-dark ms-1">Fb</span>`
        if (lm.map.type == "draft") list += `<span class="badge bg-warning text-dark ms-1">D</span>`
        if (lm.map.type == "final") list += `<span class="badge bg-primary ms-1">Fl</span>`
        if (lm.map.type == "auto") list += `<span class="badge bg-secondary ms-1">A</span>`
        if (isFirst) list += `<span class="badge bg-secondary ms-1">1</span>`
        if (isLast) list += `<span class="badge bg-info text-dark ms-1">L</span>`
        list += `<span class="ms-2 score d-none"><small>${score}</small></span>`
        list += `</span>`
        list += `</div>`
      })
      $('#list-learnermap').html(list == '' ? '<em class="text-secondary">No learnermaps.</em>' : list)
      DynamicAnalyzerApp.onCheckBoxChanged()
      resolve()
    })
  }).catch(error => reject(error))
}

DynamicAnalyzerApp.populateKits = (cmid) => {
  Core.instance().ajax().get(`kitBuildApi/getKitListByConceptMap/${cmid}`)
    .then(kits => { // console.log(kits)
      $('#select-kid option').not('.default').remove()  
      kits.forEach((k, i) => {
        let kit = `<option value=${k.kid}>`
        kit += `${k.name}`
        kit += `</option>`
        $('#select-kid').append(kit)
      })
  })
}

DynamicAnalyzerApp.onCheckBoxChanged = (e) => { // onsole.log(e)
  $('#list-learnermap .learnermap').each((i, lm) => {
    let lmid = $(lm).data('lmid')
    let type = $(lm).data('type')
    let first = $(lm).data('first') == true
    let last = $(lm).data('last') == true
    let checked = ($(`#cb-lm-${type}`).prop('checked'));
    if (!checked) checked = first == $(`#cb-lm-first`).prop('checked') && first
    if (!checked) checked = last == $(`#cb-lm-last`).prop('checked') && last
    if (!checked) checked = $(`#cb-lm-all`).prop('checked')
    $(`#cb-lm-${lmid}`).prop('checked', checked);
  })
}

DynamicAnalyzerApp.updateStatus = (learnerMap, compare) => {
  if (learnerMap) {
    let statusLearnerMap = `<span class="mx-2 d-flex align-items-center status-learnermap">`
      + `<span class="badge rounded-pill bg-warning text-dark ms-1">ID: ${learnerMap.map.lmid}</span> `
      + `<small class="text-secondary text-truncate mx-2">${learnerMap.map.author}</small>`
      + `</span>`
      StatusBar.instance().remove('.status-learnermap').append(statusLearnerMap);
  } else StatusBar.instance().remove('.status-learnermap')

  if (compare) {
    let statusCompare = `<span class="mx-2 d-flex align-items-center status-compare">`
      + `<span class="badge rounded-pill bg-success ms-1">Match: ${compare.match.length}</span>`
      + `<span class="badge rounded-pill bg-danger ms-1">Miss: ${compare.miss.length}</span>`
      + `<span class="badge rounded-pill bg-info text-dark ms-1">Excess: ${compare.excess.length}</span>`
      + `<span class="badge rounded-pill bg-secondary ms-1">Leave: ${compare.leave.length}</span>`
      + `<span class="badge rounded-pill bg-warning text-dark ms-1">Abandon: ${compare.abandon.length}</span>`
      + `</span>`
    StatusBar.instance().remove('.status-compare').append(statusCompare);
  } else StatusBar.instance().remove('.status-compare')
}

DynamicAnalyzerApp.handleRefresh = kbui => {
  let session = Core.instance().session()
  let canvas  = kbui.canvases.get(DynamicAnalyzerApp.canvasId)
  session.getAll().then(sessions => { // console.log(sessions)
    let cmid = sessions.cmid
    let lmid = sessions.lmid
    if (cmid) {
      KitBuild.openConceptMap(cmid).then(conceptMap => {
        canvas.cy.elements().remove()
        canvas.cy.add(KitBuildUI.composeConceptMap(conceptMap))
        canvas.applyElementStyle()
        canvas.toolbar.tools.get(KitBuildToolbar.CAMERA).fit(null, {duration: 0})
        DynamicAnalyzerApp.inst.setConceptMap(conceptMap)
        DynamicAnalyzerApp.populateLearnerMaps(cmid).then(() => {
          if (lmid) {
            let row = $('#list-learnermap')
              .find(`.learnermap[data-lmid="${lmid}"]`)
              .trigger('click')
            if (row.length) row[0].scrollIntoView({ block: 'center' })
          }
        })
        DynamicAnalyzerApp.populateKits(cmid)
      })
    }

    

  })
}

  await new Promise(resolve=>$(resolve));await new Promise(resolve=>setTimeout(resolve,50));
  window.nativeApp=App.inst;window.nativeCanvas=nativeApp.canvas||nativeApp.kbui?.canvases.values().next().value;
  if(nativeCanvas)new ResizeObserver(()=>requestAnimationFrame(()=>{nativeCanvas.cy.resize();nativeCanvas.canvasTool.resizeCanvas();})).observe(nativeCanvas.cy.container());
  if(nativeCanvas){let frame;document.addEventListener('scroll',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>nativeCanvas.cy.resize());},{capture:true,passive:true});}
  // 原版は画面全体を固定配置するため、ヘッダー折返しによる位置変化を検知しない。
  // 入力より前に座標だけを更新し、選択中のハンドルを維持する。
  for(const value of Object.values(nativeApp)){if(!value?.canvases)continue;for(const canvas of value.canvases.values())for(const type of ['pointerdown','mousedown','touchstart'])canvas.cy.container().addEventListener(type,()=>canvas.cy.renderer().invalidateContainerClientCoordsCache(),{capture:true,passive:true});}
  // makekit/admin画面も同じLoggerを使う。元にLoggerのある画面には二重に登録しない。
  if(nativeCanvas&&!nativeApp.logger){nativeApp.logger=(KB_PAGE.teacher?CmapLogger.instance(client.user.user_id,0,client.page,nativeCanvas):KitBuildLogger.instance(client.user.user_id,0,client.page,nativeCanvas,nativeApp.conceptMap)).enable();nativeCanvas.on('event',nativeApp.logger.onCanvasEvent.bind(nativeApp.logger));if(window.KBNativeLogBridge)KBNativeLogBridge.log=nativeApp.logger.log.bind(nativeApp.logger);}
  $('.cgpass,.bt-profile,.bt-sign-in,.bt-logout,.bt-collab,.bt-share').hide();
  document.querySelectorAll('button').forEach(b=>{if(!b.textContent.trim()&&!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title||b.className);});
  if(KB_PAGE.name==='index'){
    await nativeTaskList();
    if(nativeSession.kid&&!nativeSession.lmid){const kit=await Core.instance().ajax().get('kitBuildApi/openKitMap/'+nativeSession.kid),draft=await Core.instance().ajax().post('kitBuildApi/getLastDraftLearnerMapOfUser',{kid:nativeSession.kid});App.parseKitMapOptions(kit);await nativeApp.openLearnerMap(kit,draft);}
  }
  if(client.user.teacher)nativeTeacherControls();
  document.querySelectorAll('.status-panel').forEach(el=>{el.tabIndex=0;el.setAttribute('aria-label','マップと利用者の状態');});
  if(KB_PAGE.name==='dynamic')nativeDynamicControls();
  const labelControls=()=>{document.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(el=>{if(!el.getAttribute('aria-label')&&!el.labels?.length)el.setAttribute('aria-label',el.placeholder||el.name||el.id||'入力');});document.querySelectorAll('button').forEach(el=>{if(!el.getAttribute('aria-label'))el.setAttribute('aria-label',el.textContent.trim()||el.getAttribute('data-tippy-content')||el.title||el.className);});document.querySelectorAll('[role=button]').forEach(el=>{if(el.querySelector('input,button,select')){el.setAttribute('role','group');el.tabIndex=0;el.onkeydown=e=>{if(e.key==='Enter')el.click();};}});};labelControls();new MutationObserver(labelControls).observe(nativeDOM('workspace'),{childList:true,subtree:true});
  nativeDOM('native-ready').textContent='ready';
}
async function nativeTaskList(){const r=await client.call('native.api',{route:'kitBuildApi/getKitListOfGroups/ALL'}),host=nativeDOM('task-list');host.replaceChildren();for(const task of r.coreResult){const a=document.createElement('a');a.href='index.html?kid='+encodeURIComponent(task.kid);a.textContent=task.name;host.append(a,document.createTextNode(' '));}}
function nativeDownload(name,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function nativeTeacherControls(){
  const host=nativeDOM('task-list');
  if(KB_PAGE.name==='teacher'){
    const label=document.createElement('label');label.textContent='ゴールマップ JSON 取込 ';const input=document.createElement('input');input.type='file';input.id='native-import';input.accept='.json,application/json';label.append(input);host.append(label);
    input.onchange=()=>nativeCatch((async()=>{const raw=JSON.parse(await input.files[0].text()),data=Object.assign({},raw.map||{},raw);delete data.map;data.cmid=null;const map=await Core.instance().ajax().post('kitBuildApi/saveConceptMap',{data:Core.compress(data)});nativeApp.setConceptMap(map);nativeCanvas.reset();nativeCanvas.cy.add(KitBuildUI.composeConceptMap(map));nativeCanvas.applyElementStyle();await nativeCanvas.toolbar.tools.get(KitBuildToolbar.CAMERA).fit(null,{duration:0});nativeApp.logger.setConceptMapId(map.map.cmid);nativeApp.logger.log('import-map',map.map,null,{includeMapData:true});})());
  }
  const csv=document.createElement('button');csv.id='native-submissions-csv';csv.textContent='提出 CSV';csv.onclick=()=>nativeCatch((async()=>{let offset=0,part=0;do{const r=await Core.instance().ajax().post('gasApi/submissionsCsv',{offset});nativeDownload('submissions-'+(++part)+'.csv',r.csv);offset=r.next;}while(offset!==null);})());host.append(csv);
  const date=document.createElement('input');date.id='native-log-date';date.type='text';date.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('-','');date.setAttribute('aria-label','ログ日付 YYYYMMDD');host.append(date);
  const logs=document.createElement('button');logs.id='native-logs-csv';logs.textContent='ログ CSV';logs.onclick=()=>nativeCatch((async()=>{let offset=0,index=0;do{const r=await client.call('logs.csv',{date:date.value,offset});const cell=v=>'"'+String(v??'').replace(/^[\s\u0000-\u001f]*[=+@-]/,s=>"'"+s).replaceAll('"','""')+'"';nativeDownload('logs-'+date.value+'-'+(++index)+'.csv','\uFEFF'+[r.header,...r.rows].map(row=>row.map(cell).join(',')).join('\r\n'));offset=r.next;}while(offset!==null);})());host.append(logs);
}
function nativeDynamicControls(){
  $('.bt-proposition-set-analysis').on('click',()=>{$('.bt-teacher-map').trigger('click');$('.bt-group-map').trigger('click');});
  $('.bt-map-dev-chart').on('click',()=>nativeCatch((async()=>{
    const selected=document.querySelector('#list-learnermap .learnermap.active');if(!selected)throw new Error('学習者マップを選択してください');const lm=nativeApp.learnerMaps.get(selected.dataset.lmid),uid=lm.map.author,day=nativeDOM('native-log-date').value;let offset=0,events=[];
    do{const r=await Core.instance().ajax().post('gasApi/history',{date:day,offset,user_id:uid,snapshots:true});events.push(...r.items);offset=r.next;}while(offset!==null);
    events.sort((a,b)=>a.client_ts-b.client_ts||a.event_id.localeCompare(b.event_id));
    let dialog=nativeDOM('native-history');if(dialog)dialog.remove();dialog=document.createElement('dialog');dialog.id='native-history';dialog.setAttribute('aria-label','マップの変化と再生');const title=document.createElement('h2');title.textContent=uid+' のマップの変化';dialog.append(title);const close=document.createElement('button');close.textContent='閉じる';close.onclick=()=>dialog.close();dialog.append(close);
    const table=document.createElement('table');table.className='table table-sm';const caption=document.createElement('caption');caption.textContent='時系列のノード・接続・命題数。操作を選ぶと元のキャンバスに再生します。';table.append(caption);const head=document.createElement('tr');for(const text of ['操作','時刻','概念','リンク','接続','命題']){const th=document.createElement('th');th.textContent=text;head.append(th);}table.append(head);
    for(const e of events){const tr=document.createElement('tr'),td=document.createElement('td'),button=document.createElement('button');button.textContent=e.action;button.onclick=()=>nativeCatch((async()=>{const r=await Core.instance().ajax().post('gasApi/history',{date:day,offset:0,user_id:uid,event_id:e.event_id});let found=r.items.find(x=>x.event_id===e.event_id),next=r.next;while(!found&&next!==null){const chunk=await Core.instance().ajax().post('gasApi/history',{date:day,offset:next,user_id:uid,event_id:e.event_id});found=chunk.items.find(x=>x.event_id===e.event_id);next=chunk.next;}if(!found?.map)throw new Error('スナップショットがありません');nativeCanvas.reset();nativeCanvas.cy.add(Core.decompress(found.map));nativeCanvas.applyElementStyle();await nativeCanvas.toolbar.tools.get(KitBuildToolbar.CAMERA).fit(null,{duration:0});dialog.close();})());td.append(button);tr.append(td);for(const v of [new Date(e.client_ts).toLocaleTimeString(),e.nc,e.nl,e.ne,e.np]){const cell=document.createElement('td');cell.textContent=v;tr.append(cell);}table.append(tr);}dialog.append(table);document.body.append(dialog);dialog.showModal();
  })()));
}

window.addEventListener('online',()=>client.flush());
document.addEventListener('visibilitychange',()=>{if(client.user&&document.visibilityState==='visible')client.flush();});
